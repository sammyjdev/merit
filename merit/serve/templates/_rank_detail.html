<div class="rank-detail">
  {% if hits.strong %}<p><span class="chip-strong">fortes:</span> {{ hits.strong|join(" · ") }}</p>{% endif %}
  {% if hits.partial %}<p><span class="chip-partial">parciais:</span> {{ hits.partial|join(" · ") }}</p>{% endif %}
  {% if hits.gap %}<p><span class="chip-gap">lacunas:</span> {{ hits.gap|join(" · ") }}</p>{% endif %}
  <pre>{{ body }}</pre>
</div>
