{% extends "base.html" %}
{% block content %}
<style>
.pipeline-kanban {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  align-items: flex-start;
  padding-bottom: 16px;
}
.pipeline-column {
  flex: 0 0 240px;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.column-header {
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.column-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pipeline-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow);
}
.pipeline-card.selected {
  outline: 2px solid var(--accent);
  background: var(--accent-weak);
}
.card-header {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.card-title {
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
}
.card-title:hover {
  color: var(--accent);
}
.card-company {
  color: var(--muted);
  font-size: 13px;
}
.card-meta {
  font-size: 12px;
}
.card-date {
  font-family: var(--mono);
  color: var(--muted);
}
.card-actions {
  margin-top: 4px;
}
.card-actions select {
  width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
}
.pipeline-empty {
  padding: 32px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
</style>
{% include "_pipeline_board.html" %}
{% endblock %}
