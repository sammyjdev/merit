{% extends "base.html" %}
{% block content %}
<h1>vagas</h1>
<nav class="src-filter" aria-label="origem">
  <a href="/vagas" class="pill {% if not src %}active{% endif %}">todas {{ counts.inmail + counts.alerta }}</a>
  <a href="/vagas?src=inmail" class="pill {% if src == 'inmail' %}active{% endif %}">inmail {{ counts.inmail }}</a>

</nav>
{% include "_vagas_rows.html" %}
{% endblock %}
